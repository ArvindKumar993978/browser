name: Build and Release Orbit Browser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build Windows installer and update metadata
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/Orbit-Browser-Setup-*.exe
            dist/Orbit-Browser-Setup-*.exe.blockmap
            dist/latest.yml

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build Android APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare named APK artifact
        run: |
          mkdir -p android-dist
          cp android/app/build/outputs/apk/release/app-release.apk "android-dist/Orbit-Browser-Android-${GITHUB_REF_NAME}.apk"

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android-dist/Orbit-Browser-Android-*.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: release-assets

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release-assets

      - name: Create single GitHub Release with Windows & Android binaries
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
