name: Build and Release Orbit Browser

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck and test
        run: npm run typecheck && npm test

      - name: Build Windows installer and update metadata
        run: npx electron-vite build && npx electron-builder --win --publish never

      - name: Create single GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Orbit-Browser-Setup-*.exe
            dist/Orbit-Browser-Setup-*.exe.blockmap
            dist/latest.yml
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
